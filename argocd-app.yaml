apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mixsupasek/gitops-release-pipeline.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {}