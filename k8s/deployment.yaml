apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-api
  template:
    metadata:
      labels:
        app: release-api
    spec:
      containers:
        - name: api
          image: ghcr.io/mixsupasek/gitops-release-pipeline:fd700249d6e09c38e10f672bef70499d7a030cfa
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080