apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-api
  template:
    metadata:
      labels:
        app: release-api
    spec:
      containers:
        - name: api
          image: ghcr.io/mixsupasek/gitops-release-pipeline:ace1f9c4509e7df37bc2d9ede5082d9870aa6071
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080