name: Publish release API

on:
  push:
    branches: [main]
    paths:
      - app.py
      - Dockerfile
      - .github/workflows/publish.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build -t "$image" .
          docker run -d --name release-api-test -p 127.0.0.1:8080:8080 "$image"
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 --max-time 2 \
            http://127.0.0.1:8080/health || {
              docker logs release-api-test
              exit 1
            }

      - name: Push image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"